name: Photo Service Image CI

on:
  pull_request:
    branches: [dev]
    paths: &photo_paths
      - app/photo_main.py
      - app/photo_optimizer.py
      - tests/test_photo*.py
      - Dockerfile.photo
      - requirements-photo.txt
      - .dockerignore
      - .github/scripts/check_photo_image.py
      - .github/workflows/photo-service-image-ci.yml
  push:
    branches: [dev]
    paths: *photo_paths
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only when running from dev
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: photo-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  photo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: dorosiya/pawbridge-photo-service:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-photo.txt
      - name: Test photo contracts with photo dependencies
        run: |
          python -m pip install -r requirements-photo.txt httpx==0.27.0
          python -m unittest discover -s tests -p 'test_photo*.py'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build photo image for runtime verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.photo
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=photo-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=photo-image' || '' }}
      - name: Check authentication and full-size compression under runtime limits
        run: python .github/scripts/check_photo_image.py "$IMAGE"
      - name: Log in for approved dev publication
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: dorosiya
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish exactly the verified image
        if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        run: |
          set -euo pipefail
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")"
          [[ "$revision" == "$GITHUB_SHA" ]]
          docker push "$IMAGE"
          docker buildx imagetools inspect "$IMAGE" > photo-image-manifest.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' photo-image-manifest.txt)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "dorosiya/pawbridge-photo-service@$digest"
          printf 'Photo image: `dorosiya/pawbridge-photo-service@%s`\nSource revision: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
